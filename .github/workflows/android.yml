kkkname: Build Android APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Real backend only. Mock auth is never enabled in CI builds.
      VITE_USE_MOCK_AUTH: "false"
      # Repo *variable* (Settings > Secrets and variables > Actions > Variables). Public value, not a secret.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_APP_SCHEME: famgateway
    steps:
      - uses: actions/checkout@v4
      - name: Require backend URL
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then echo "Set repo variable VITE_API_BASE_URL (https://<koyeb-domain>)"; exit 1; fi
          case "$VITE_API_BASE_URL" in https://*) ;; *) echo "VITE_API_BASE_URL must be https://"; exit 1;; esac
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # Passkeys are bound to the APK signing certificate (Digital Asset Links). A fresh debug keystore on every
      # runner would change the fingerprint each build, so restore a fixed one from a secret.
      - name: Restore fixed debug keystore (optional but required for passkeys)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore; else echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 not set - APK fingerprint will change every build; passkeys will not match assetlinks.json"; fi
      - name: Point Capacitor passkey plugin at the backend host
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          const u=new URL(process.env.VITE_API_BASE_URL);
          c.plugins.CapacitorPasskey.origin=u.origin;c.plugins.CapacitorPasskey.domains=[u.hostname];
          fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
      - run: npm install
      - run: npm run build
      - run: npx cap add android || true
      - name: Register famgateway:// deep link (Google sign-in return)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          if 'android:scheme="famgateway"' not in s:
              f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="famgateway" android:host="auth"/></intent-filter>'
              s=s.replace('</activity>', f+'\n</activity>', 1)
              open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - name: Print APK signing fingerprint (use for ANDROID_CERT_SHA256 / PASSKEY_ANDROID_ORIGINS)
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E "SHA256" || true
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK to Release (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FamGateway.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest FamGateway.apk --title "Latest APK" --notes "Auto-built from ${{ github.sha }}"
