name: Build Android APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run build
      - run: npx cap add android || true
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
      - name: Publish APK to Release (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FamGateway.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest FamGateway.apk --title "Latest APK" --notes "Auto-built from ${{ github.sha }}"
